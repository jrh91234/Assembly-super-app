name: Sync apps & deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # pull latest front-ends from source repos every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    # Scheduled runs use the repo's default branch; only main may deploy to
    # the github-pages environment, so skip anywhere else instead of failing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync apps from source repos
        if: github.event_name != 'push'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          python3 scripts/sync-apps.py
          if [ -n "$(git status --porcelain apps)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add -A apps
            git commit -m "Sync apps from source repos"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
